- tool: TypeSpecValidation
  reason: >
    Not ready to generate SDKs from TypeSpec.
    Responsibility: Service team with SDK team collaboration.
    More info: https://aka.ms/azsdk/spec-gen-sdk-config.
  rules: [SdkTspConfigValidation]
  sub-rules:
    - options.@azure-tools/typespec-ts.*
    - options.@azure-typespec/http-client-csharp-mgmt.*
  paths: [Microsoft.StorageDataManagement.Management/tspconfig.yaml]
- tool: LintDiff
  reason: >
    The 2026-06-01 Connector PATCH contract is carried forward unchanged from
    existing API versions. Blob Access Point authentication updates require the
    discriminator to select the credential shape; all other PATCH fields remain
    optional.
  rules: [PatchBodyParametersSchema]
  paths:
    - resource-manager/Microsoft.Storage/storageDataManagement/stable/2026-06-01/StorageDataManagementRP.json
- tool: LintDiff
  reason: >
    Blob Access Point PATCH exposes a mutable subset of properties from
    discriminated source variants. The validator compares against the common
    source base model and cannot correlate auth, expectedBucketOwner, and
    paymentModel with their concrete source variants.
  rules: [ConsistentPatchProperties]
  paths:
    - resource-manager/Microsoft.Storage/storageDataManagement/stable/2026-06-01/StorageDataManagementRP.json
- tool: LintDiff
  reason: >
    proposedconnectiontest intentionally tests a configuration before a
    BlobAccessPointConfiguration resource exists, so it is modeled as a POST on
    the resource collection rather than an instance action.
  rules: [PathForResourceAction]
  paths:
    - resource-manager/Microsoft.Storage/storageDataManagement/stable/2026-06-01/StorageDataManagementRP.json
- tool: LintDiff
  reason: >
    The list paths include the complete virtual storageAccounts parent segment.
    The validator does not resolve the TypeSpec virtual parent when evaluating
    the nested resource list route.
  rules: [MissingSegmentsInNestedResourceListOperation]
  paths:
    - resource-manager/Microsoft.Storage/storageDataManagement/stable/2026-06-01/StorageDataManagementRP.json
