parameters:
  "service-dir":
    default: "sdk/azurecontextcache"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    use-read-only-status-schema: true
    emitter-output-dir: "{project-root}/.."
    azure-resource-provider-folder: "resource-manager"
    output-file: "{azure-resource-provider-folder}/Microsoft.Storage/storageContextCache/{version-status}/{version}/StorageContextCacheRP.json"
    examples-dir: "{project-root}/examples"
    emit-lro-options: "all"
    new-line: lf
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.AzureContextCache"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-azurecontextcache"
    namespace: "azure.mgmt.azurecontextcache"
    generate-test: true
    generate-sample: true
    flavor: "azure"
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-azurecontextcache"
    namespace: "com.azure.resourcemanager.azurecontextcache"
    service-name: "Azure Context Cache"
    flavor: azure
  "@azure-tools/typespec-ts":
    emitter-output-dir: "{output-dir}/{service-dir}/arm-azurecontextcache"
    azureSdkForJs: true
    isModularLibrary: true
    generateMetadata: true
    flavor: azure
    hierarchyClient: false
    experimental-extensible-enums: true
    enableOperationGroup: true
    package-details:
      name: "@azure/arm-azurecontextcache"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/azurecontextcache"
    emitter-output-dir: "{output-dir}/{service-dir}/armazurecontextcache"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armazurecontextcache"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
