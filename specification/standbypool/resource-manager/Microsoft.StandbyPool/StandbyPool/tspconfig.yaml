linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    use-read-only-status-schema: true
    azure-resource-provider-folder: "resource-manager"
    emitter-output-dir: "{project-root}"
    output-file: "{version-status}/{version}/standbypool.json"
    emit-common-types-schema: never
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    # omit the enum type Versions from being added to versioned swagger
    omit-unreachable-types: true
  "@azure-tools/typespec-go":
    service-dir: sdk/resourcemanager/standbypool #!!!IMPORTANT!!! To ensure the emitter correctly produces SDK, this configuration is added by Azure SDK Team. Some configurations use standbypool values. For modifications, please refer to https://aka.ms/azsdk/specs/typespec-validation#sdktspconfigvalidation
