- tool: AvoidAdditionalProperties
  paths:
    - preview/2026-06-01-preview/bami.json
  reason: >-
    AppConsentContext.appsToConsent is an inherently dynamic map (Azure environment name -> tenant ID -> first-party
    application IDs) that mirrors the wire contract the BAMI service serializes. It is modeled in TypeSpec as named
    Record-based definitions (EnvironmentApplicationConsents, TenantApplicationConsents) so SDKs get named types; the
    resulting additionalProperties usage is required and intentional. Per the Swagger LintDiff for TypeSpec guidance,
    AvoidAdditionalProperties arising from required Record usage is suppressed.
