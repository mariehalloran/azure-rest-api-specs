parameters:
  "service-dir":
    default: "sdk/partnerprogram"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    use-read-only-status-schema: true
    emit-lro-options: "none"
    emitter-output-dir: "{project-root}"
    output-file: "{version-status}/{version}/openapi.json"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-partnerprogram"
    namespace: "azure.mgmt.partnerprogram"
    generate-test: true
    generate-sample: true
    flavor: "azure"
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-partnerprogram"
    namespace: "com.azure.resourcemanager.partnerprogram"
    service-name: "PartnerProgram"
    flavor: azure
  "@azure-tools/typespec-ts":
    emitter-output-dir: "{output-dir}/{service-dir}/arm-partnerprogram"
    flavor: azure
    experimental-extensible-enums: true
    package-details:
      name: "@azure/arm-partnerprogram"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/partnerprogram"
    emitter-output-dir: "{output-dir}/{service-dir}/armpartnerprogram"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armpartnerprogram"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
    - "@azure-tools/typespec-azure-rulesets/client-sdk"
