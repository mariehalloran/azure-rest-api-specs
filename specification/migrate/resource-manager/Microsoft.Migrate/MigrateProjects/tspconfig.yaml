parameters:
  "service-dir":
    default: "sdk/migrate"
emit:
  - "@azure-tools/typespec-autorest"
output-dir: "{project-root}/../../"
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
options:
  "@azure-tools/typespec-autorest":
    emitter-output-dir: "{project-root}"
    output-file: "{version-status}/{version}/migrateProjects.json"
    azure-resource-provider-folder: ./resource-manager
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
    examples-dir: "{project-root}/examples"
    use-read-only-status-schema: true
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-migrateprojects"
    namespace: "azure.mgmt.migrateprojects"
    package-name: "azure-mgmt-migrateprojects"
    generate-test: true
    generate-sample: true
    flavor: "azure"
  "@azure-tools/typespec-java":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-resourcemanager-migrate-projects"
    namespace: "com.azure.resourcemanager.migrate.projects"
    generate-sample: true
    service-name: "migrate"
    flavor: azure
  "@azure-tools/typespec-ts":
    emitter-output-dir: "{output-dir}/{service-dir}/arm-migrateprojects"
    flavor: azure
    experimental-extensible-enums: true
    package-details:
      name: "@azure/arm-migrateprojects"
  "@azure-typespec/http-client-csharp-mgmt":
    namespace: "Azure.ResourceManager.Migrate.Projects"
    emitter-output-dir: "{output-dir}/{service-dir}/{namespace}"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/migrate"
    emitter-output-dir: "{output-dir}/{service-dir}/armmigrateprojects"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armmigrateprojects"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
