parameters:
  "service-dir":
    default: "sdk/validate"
emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    use-read-only-status-schema: true
    omit-unreachable-types: true
    emitter-output-dir: "{project-root}/.."
    azure-resource-provider-folder: "resource-manager"
    output-file: "{azure-resource-provider-folder}/{service-name}/{version-status}/{version}/validate.json"
    examples-dir: "{project-root}/examples"
  # ----- SDK emission (aligned with the Microsoft.Validate ARM RP) -----
  # Invoked per-language by tsp-client in the SDK repos; not in `emit` above
  # so `tsp compile` in the spec repo still produces only swagger.
  "@azure-tools/typespec-python":
    emitter-output-dir: "{output-dir}/{service-dir}/azure-mgmt-validate"
    namespace: "azure.mgmt.validate"
    flavor: "azure"
    generate-test: true
    generate-sample: true
  "@azure-typespec/http-client-csharp-mgmt":
    emitter-output-dir: "{output-dir}/{service-dir}/Azure.ResourceManager.Validate"
    namespace: "Azure.ResourceManager.Validate"
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
