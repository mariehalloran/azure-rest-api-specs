- tool: TypeSpecValidation
  reason: >
    Not ready to generate SDKs from TypeSpec.
    Responsibility: Service team with SDK team collaboration.
    More info: https://aka.ms/azsdk/spec-gen-sdk-config.
  rules: [SdkTspConfigValidation]
  sub-rules:
    - options.@azure-tools/typespec-ts.*
    - options.@azure-tools/typespec-go.*
  paths:
    - ApplicationMigration.Management/ApplicationDiscovery.Management/tspconfig.yaml
    - ApplicationMigration.Management/WorkloadsDiscovery.Management/tspconfig.yaml
    - ApplicationMigration.Management/Network.Management/tspconfig.yaml

- tool: LintDiff
  reason: >
    The triggerRefresh action on NetworkAgent uses the same pattern as the
    existing PGSQL Agent, MongoDB MongoAgent, Oracle OracleAgent, and Storage
    Agent — all use ArmResourceActionNoResponseContentAsync<T, void> and emit
    `202 + default`. This is consistent across every workload agent in
    Microsoft.ApplicationMigration. The LintDiff PostResponseCodes rule
    flags new additions only; the sibling RPs were merged before this rule
    was tightened.
  rules: [PostResponseCodes]
  paths:
    - Microsoft.ApplicationMigration/Network/preview/2026-01-01-preview/NetworkDiscovery.json
