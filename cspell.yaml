version: '0.2'
language: en
flagWords:
  - teh
ignorePaths:
  - .gitignore
  - .vscode/**
  - '**/examples/**'
  - '**/package-lock.json'
  - cspell.json
  - cspell.yaml
  - eng/**
  - .github/skills/**
  - node_modules/**
  - specification/suppressions.yaml
ignoreRegExpList:
  - Base64
  - email
  - v\d
minWordLength: 4
dictionaries:
  - companies
  - csharp
  - go
  - html
  - java
  - node
  - python
  - softwareTerms
  - typescript
enableFiletypes:
  - cadl
allowCompoundWords: true
words:
  - agentic
  - alletra
  - alua
  - azext
  - byos
  - cadl
  - contoso
  - eastus
  - entra
  - evals
  - fcsp
  - fqdns
  - gbps
  - hana
  - iqns
  - iscsi
  - kusto
  - ldev
  - liftr
  - localizable
  - mbps
  - mgmt
  - nguid
  - nsid
  - nvme
  - odata
  - onboarded
  - ontap
  - payg
  - regen
  - rpaas
  - skus
  - vmss
  - vnet
  - waza
  - westus
  - wwns
  - wwpns
caseSensitive: false
overrides:
  - filename: '/README.md'
    words:
      - azsdk
